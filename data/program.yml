# ─────────────────────────────────────────────────────────────
# The programme. Every event is placed on the grid purely from its
# `start`/`end` — build.py computes the CSS grid rows, so you never
# touch a row number again. Just edit the times.
#
# event keys
#   type      a key from `types:` below — picks the colour and the legend row
#   title     bold first line
#   chair     appended as "(Chair: …)"
#   start/end "HH:MM", 5-minute resolution
#   time_label  overrides the "09:30 – 10:50" line (e.g. "from 18:00")
#   time_in_title  render as "Title · 09:20" with no separate time line
#   bare      render the title as plain centred text (coffee breaks)
#   density   normal (default) | compact | tiny — for short slots
#   speakers  list of {name, affil, topic, talk, abstract, note}
#             `talk` is the full title and `abstract` the text behind the
#             Abstract button in the list view — both optional, and neither is
#             emitted in the anonymised build. `note` records availability and
#             confirmation status and is only rendered in the internal build,
#             never on the public page.
#   notes     extra italic lines under the speakers
#   anon_note what replaces speakers/notes in the anonymised build;
#             blocks fall back to "N talks · M min each"
#   calendar  set false to keep an event out of the .ics export
# ─────────────────────────────────────────────────────────────

# "(tentative)" said the whole thing might move. It will not: the days, the
# hours and the shape of them are settled. What is not settled is which talk
# goes in which slot, which is a smaller and more useful thing to say — and it
# is exactly what the grid is showing, every session reading "Invited talk ·
# TBD". The note goes beside the heading rather than in it, so the section is
# called what it is.
title: Program
title_ko: 프로그램
title_note: speaker order to be confirmed
title_note_ko: 연사 순서는 확정 전

# The schedule shown in simple form: every talk reads "Invited talk" with its
# hour and TBD, and the names, topics and chairs are held back. The tutorial is
# drawn as a talk like the rest.
#
# Nothing is deleted to do it. The speakers are still in this file and the
# Speakers section is still built from them — this only governs what the grid
# and the list say. Set it false and the sessions get their own names, their
# chairs and their speakers back in one move. data/program.detailed.yml is the
# shape the programme had before the times were rearranged, kept for the same
# reason.
simple: true
simple_label: Invited talk

# Public page shows no subtitle. The invite build keeps `subtitle_anon`, which
# has to explain the session shape to someone being asked to speak.
subtitle: ~

# Shown instead of `subtitle` when the build is anonymised.
subtitle_anon: >-
  October 7–8 (Wed–Thu), 2026 · POSTECH. Each session holds two 40-minute
  talks; the tutorial is 60 minutes. Speakers are being confirmed.

# All clock times in this file are local to the venue. The offset is what makes
# the "Now" button and the .ics export correct for a reader in another zone.
timezone: Asia/Seoul
utc_offset: "+09:00"

# Grid geometry. slot = one CSS grid row.
grid:
  slot_minutes: 5
  header_rows: 8
  day_start: "09:00"
  day_end: "20:30"
  axis_from: "09:00"
  axis_to: "20:00"
  axis_step_minutes: 60
  time_column_width: 64px
  min_width: 560px

# Event types. `color` is the accent — left border and legend swatch — and the
# pale fill behind the box is derived from it, so one hex per type is all you
# set. Adding a type here gives it a CSS rule and a legend row automatically;
# leave `color` out and build.py picks an unused hue for it. Using a `type:` in
# an event that is not listed here fails the build.
# `label` is the legend text; `short` is the badge in the list view and falls
# back to `label` when you leave it out.
# `emoji` is the default mark for the type; an event can override it with its
# own `emoji:` where the type's is wrong — a lunch break is not a coffee break.
types:
  tutorial: { label: Tutorial, color: "#3f51b5", emoji: "📘" }
  block: { label: Talk block, color: "#00796b", short: Talks, emoji: "🎤" }
  keynote: { label: Ceremony (opening / closing), color: "#c2185b", short: Ceremony, emoji: "🎉" }
  poster: { label: Poster session, color: "#f57c00", short: Poster, emoji: "📌" }
  social: { label: Social / Meals, color: "#1976d2", short: Social, emoji: "🥂" }
  break: { label: Break, color: "#9e9e9e", emoji: "☕" }
  # Runs alongside the poster session rather than instead of it, and is not
  # open — the label has to say so, because a coloured box on a programme reads
  # as an invitation.
  internal: { label: Closed session, color: "#7b1fa2", short: Closed, emoji: "🧩" }

