              효율적인 의사결정과 학습 알고리즘을 연구하고 있다. KAIST 수리과학과에서 학사 및 박사학위를 취득하였으며, 이후
              University of Arizona, New York University, University of Milan에서 박사후연구원으로
              근무하였다. 주요 연구 관심사는 이론적 강화학습, 온라인 학습, 밴딧 알고리즘 및 통계적 머신러닝이며, 이론적 보장을 갖는 효율적인
              학습 방법론의 개발에 초점을 두고 있다." Worth his confirming the English before it is read
              as his own words.
