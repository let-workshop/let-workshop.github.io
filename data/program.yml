      - type: block
        title: Bandits II
        chair: Chulhee Yun
        start: "16:40"
        end: "18:00"
        speakers:
          - name: Min-hwan Oh
            role: Prof.
            role_ko: 교수
            name_ko: 오민환
            photo: min-hwan-oh.jpg
            affil: SNU
            talk: >-
              Provably Optimal Exploration with Quasi-Optimism
            abstract: >-
              Many multi-armed bandit and reinforcement learning algorithms rely on full
              optimism, using confidence bonuses large enough to upper-bound unknown
              values with high probability. This talk presents quasi-optimism, a new
              exploration principle that allows a controlled degree of underestimation
              while retaining provably optimal regret guarantees. We first introduce
              this principle in tabular reinforcement learning, where a simple
              inverse-count bonus achieves minimax-optimal regret without empirical
              variance estimation. We then discuss its extension to
              distribution-dependent and instance-dependent regret guarantees in bandits
              and reinforcement learning. Finally, we extend quasi-optimism to linear
              contextual bandits using a quadratic–linear bonus. Despite not being
              pointwise optimistic, the resulting algorithm simultaneously achieves
              minimax-optimal and tight margin-dependent regret guarantees while
              substantially reducing unnecessary exploration in empirical evaluations.
              Together, these results suggest that quasi-optimism is both theoretically
              optimal and practically effective.
            bio: >-
              Min-hwan Oh is an Associate Professor in the Graduate School of Data
              Science at Seoul National University. His research focuses on sequential
              decision-making under uncertainty, reinforcement learning, bandit
              algorithms, stochastic optimization, and statistical machine learning. He
              received his Ph.D. from Columbia University.
            note: >-
              Form (8/31): free in every session on Day 2, nothing on Day 1. The Drive
              link that came with the submission was his photograph; it is in
              static/speakers/ now, so the link is not needed.
            home: https://minoh.io/
          - name: Kwang-Sung Jun
            role: Prof.
            role_ko: 교수
            name_ko: 전광성
            photo: kwang-sung-jun.jpg
            affil: POSTECH
            talk: "Frontiers of Offline Interactive Machine Learning: From Contextual Bandits to LLM Alignment"
            abstract: >-
              At the heart of modern machine learning lies a fundamental challenge: how
              can an intelligent system not just learn from data but also decide which
              data to collect for learning? This is the essence of interactive machine
              learning (IML) -- a paradigm that encompasses reinforcement learning,
              contextual bandits, and active learning. Recently, the offline version of
              IML has gained popularity because the traditional online version often
              cannot be run due to real-world constraints. In this talk, I will show two
              recent advances in offline IML problems. First, I will discuss the
              contextual bandit problem that has applications in recommendation systems. I
              will show how an improved confidence bound for [0,∞)-valued random variable
              translates into a superior learning algorithm, both in theory and practice.
              Second, I will show that the LLM alignment problem is an instance of offline
              IML and that existing training objectives for it lack theoretical
              justification, leaving us wondering if they are the right ones to use. As
              such, I will present a novel theoretical framework for alignment from which
              three different alignment algorithms are derived along with theoretical
              guarantees, which is a strong form of justification. Surprisingly, two of
              them are very similar to existing algorithms called Direct Policy
              Optimization (DPO) and reinforcement learning from human feedback (RLHF),
              respectively. Together with our theoretical guarantees, our work can be seen
              as providing theoretical justifications to DPO and RLHF, with minor
              corrections. Furthermore, our theory confirms the existing empirical finding
              that RLHF performs better than DPO. I will conclude with empirical results
              and exciting future research directions.
            bio: >-
              Kwang-Sung Jun is an associate professor in the Department of Computer
              Science & Engineering at POSTECH. His research interest is interactive
              machine learning in general, and, in particular, both theory and practice in
              bandit problems, active learning, confidence bounds, and, more recently,
              emerging problems in LLM post training. Before joining POSTECH, he was an
              assistant professor at the University of Arizona.
            note: >-
              Form (9/14): free in every session on both days.
            home: https://kwangsungjun.github.io/
            links:
              scholar: https://scholar.google.com/citations?user=VgvC7o8AAAAJ

