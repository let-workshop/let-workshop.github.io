      - type: block
        title: Offline RL
        chair: Kwang-Sung Jun
        start: "15:05"
        end: "16:25"
        speakers:
          - name: Kyoungseok Jang
            role: Prof.
            role_ko: 교수
            name_ko: 장경석
            photo: kyoungseok-jang.jpg
            affil: CAU
            talk: >-
              Revisiting Bellman Residual Minimization: From Duality to Modern Offline
              Reinforcement Learning
            abstract: >-
              Bellman residual minimization (BRM) is a classical approach to
              reinforcement learning that directly seeks a value function satisfying the
              Bellman equation. Despite its conceptual simplicity and attractive
              fixed-point interpretation, BRM has historically faced major computational
              and statistical difficulties, including the double-sampling problem and
              challenging nonconvex optimization. Recent dual formulations provide a new
              perspective on these obstacles, transforming BRM into tractable minimax
              problems amenable to stochastic gradient methods.


              In this talk, I will briefly review the history, strengths, and
              limitations of BRM and discuss how this dual perspective enables a modern
              treatment of the framework. I will then present our recent results along
              three directions: Off-GLADIUS, which establishes global convergence
              guarantees for gradient-based BRM in offline reinforcement learning;
              Stability and Generalization for Bellman Residuals, which provides fast
              statistical guarantees through algorithmic stability; and Stoc-TBRM, which
              extends the BRM perspective to stochastic trajectory-level learning.
              Together, these results suggest that BRM, despite being a classical
              framework, can provide a scalable and theoretically principled foundation
              for modern offline reinforcement learning.
            bio: >-
              Kyoungseok Jang is an Assistant Professor in the Department of Artificial
              Intelligence at Chung-Ang University, where he works on efficient
              decision-making and learning algorithms under uncertainty, centred on
              reinforcement learning, online learning and bandits. He received his BS
              and PhD from the Department of Mathematical Sciences at KAIST, and was
              subsequently a postdoctoral researcher at the University of Arizona, New
              York University and the University of Milan. His research interests are
              theoretical reinforcement learning, online learning, bandit algorithms and
              statistical machine learning, with a focus on developing efficient
              learning methods that carry theoretical guarantees.
            note: >-
              Bio, title and abstract arrived 10/5, relayed by Junghyun Lee — the 9/14
