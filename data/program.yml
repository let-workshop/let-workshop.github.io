      # The afternoon's fourth session, and the reason the banquet moves. One
      # talk rather than two: it is what the hour between the last pair and the
      # posters holds, and it is the slot Donghwan Kim ticked.
      - type: block
        title: DL Theory III
        chair: Chulhee Yun
        start: "16:40"
        end: "17:20"
        speakers:
          - name: Donghwan Kim
            role: Prof.
            role_ko: 교수
            name_ko: 김동환
            photo: donghwan-kim.jpg
            affil: KAIST
            talk: Edge of Stability Occurs in Minimax Optimization
            bio: >-
              Donghwan Kim is an Associate Professor in the Department of Mathematical
              Sciences and an affiliated faculty member of the Graduate School of AI for
              Math at KAIST. His research focuses on optimization and learning theory for
              deep learning and generative models.
            abstract: >-
              The Edge of Stability (EoS) is widely observed in neural network training
              for minimization, where gradient methods continue to make progress while
              operating near their stability thresholds. Yet an analogous phenomenon has
              not been clearly identified in minimax optimization. In this talk, I will
              formulate minimax EoS using possibly complex Jacobian eigenvalues and show
              that it arises in two-player zero-sum games trained with Extragradient
              (EG) and Optimistic Gradient Descent Ascent (OGDA). Interestingly, when
              the dominant eigenvalues lie near the real axis, OGDA continues to exhibit
              EoS whereas EG becomes unstable. I will also describe how the
              self-stabilization mechanism from minimization extends to explain these
              EoS behaviors.
            note: >-
              Form (8/25): free Day 1 in all four sessions and Day 2 morning — this slot
              among them. The abstract came with the 9/29 resubmission; the first form
              gave it as TBA.
            topic: minimax optimization
            home: https://mathsci.kaist.ac.kr/~donghwankim/
            links:
              scholar: https://scholar.google.com/citations?user=G74RcZQAAAAJ

      - type: poster
        title: Poster Session
        track: 1
        start: "17:20"
        end: "18:20"
        # Who is presenting, from the registration form. Not `speakers`: the
        # Speakers section is built from that key, and fifteen poster authors
        # in it would say the workshop has thirty-one invited talks.
        posters:
          - name: Changmin Kang
            name_ko: 강창민
            affil: KAIST AI
            title: >-
              The Implicit Bias of Steepest Descent on Multiclass Nonseparable Data
            abstract: >-
              We study steepest descent for linear multiclass classification with
              softmax cross-entropy on nonseparable data. Unlike binary nonseparable
              logistic regression, where the data split into separable and nonseparable
              examples, a multiclass example induces multiple pairwise margin
              constraints that may differ in separability. We therefore introduce a
              norm-dependent parameter-space decomposition: one component remains
              constant throughout the descent, an escaping component that maximizes the
              margin in the separable subspace, and a bounded component that converges
              to a finite optimum in the nonseparable subspace. We derive convergence
              rates of the risk to its infimum and of the normalized margin of the
              escaping component to the norm-dependent optimum. We also characterize
              directional convergence. When the norm is strictly convex, the max-margin
              direction is unique and the escaping component converges to it
              directionally. Without strict convexity, we find that this can fail: we
              construct a linear classification problem and an optimization norm for
              which the normalized escaping component has multiple distinct max-margin
              accumulation points, even with separable training data.
          - name: Kyuwon Kim
            name_ko: 김규원
            affil: KAIST MAS
            title: >-
              Understanding Prediction Target, Time Sampling, and Model Capacity in
              Diffusion Models
            abstract: >-
              Denoising diffusion models require several coupled design choices: what
              the network predicts, how timesteps are sampled during training, and how
              much capacity the architecture provides. Three recent empirical findings
              shed light on how to make these choices: (i) clean data prediction can
              have higher generation quality than standard noise or velocity prediction;
              (ii) sampling timesteps from a logit-normal distribution can outperform
              uniform sampling; and (iii) generation quality can peak at an intermediate
              model capacity. However, a theoretical understanding of these observations
              and of how the three choices interact remains limited. In this paper, we
              show that theoretical counterparts of all three observations already arise
              in a tractable linear model with Gaussian data and a time-gated predictor.
              Specifically, our spectral analysis reveals how the three choices jointly
              determine spectral components of the data are represented by the model
              and, in turn, the generated distribution. This analysis further shows that
              optimal design choices vary with the spectral structure of the data. We
              provide empirical support for our theoretical findings on synthetic and
              real data.
          - name: Junsoo Oh
            name_ko: 오준수
            affil: KAIST AI
            title: >-
              Mamba Can Learn Low-Dimensional Targets In-Context via Test-Time Feature
              Learning
            abstract: >-
              Mamba, a recently proposed linear-time sequence model, has attracted
              significant attention for its computational efficiency and strong
              empirical performance. However, a rigorous theoretical understanding of
              its underlying mechanisms remains limited. In this work, we provide a
              theoretical analysis of Mamba's in-context learning (ICL) capability by
              focusing on tasks defined by low-dimensional nonlinear target functions.
              Specifically, we study in-context learning of a single-index model, which
              depends on only a single relevant direction, referred to as a feature. We
              prove that Mamba, pretrained by gradient-based methods, can achieve
              efficient ICL via test-time feature learning, extracting the relevant
              direction directly from context examples. Consequently, we establish a
              test-time sample complexity that improves upon linear Transformers —
              analyzed to behave like kernel methods — and is comparable to nonlinear
              Transformers, which have been shown to surpass the Correlational
              Statistical Query (CSQ) lower bound and achieve near
              information-theoretically optimal rate in previous works. Our analysis
              reveals the crucial role of the nonlinear gating mechanism in Mamba for
              feature extraction, highlighting it as the fundamental driver behind
              Mamba's ability to achieve both computational efficiency and high
              performance.
          - name: Taewon Koo
            name_ko: 구태원
            affil: KAIST
            title: >-
              Minimax Optimality of Posterior Sampling for Reinforcement Learning
            abstract: >-
              Posterior sampling for reinforcement learning (PSRL) is one of the
              simplest and most effective exploration methods, but a basic question has
              remained open: does unmodified PSRL achieve minimax regret without
              structural assumptions on the prior? We answer yes. Exact vanilla PSRL is
              minimax optimal in leading-order Bayesian regret under arbitrary
              correlated priors. The difficulty is that a posterior-sampled transition
              model is coupled with its own continuation value. We overcome this with a
              common empirical transition reference that isolates the resulting value
              mismatch and a Bellman-based variance argument that controls it without an
              extra leading-order state-space factor. For finite-horizon,
              time-inhomogeneous tabular MDPs with unknown stochastic rewards, this
              yields the minimax Oe( √ SAH3K) regret rate under arbitrary joint priors
              over rewards and transitions. The same proof principle gives the minimax
              Oe(d √ H3K) rate for linear-mixture MDPs under arbitrary joint parameter
              priors.
          - name: Donggeun Kim
            name_ko: 김동근
            affil: POSTECH IME
            title: >-
              Online Thompson sampling for generalized linear bandits
            abstract: >-
              Applying Thompson sampling (TS) to generalized linear bandits (GLBs) is
              computationally challenging because exact posterior updates are generally
              intractable. Existing GLB algorithms with strong regret guarantees
              typically rely on batch estimators built from accumulated data, while
              computationally efficient one-pass methods often require problem-dependent
              quantities, such as an upper bound on the context norm and a radius of a
              ball containing the true parameter, as explicit inputs to their
              implementation. We propose OnlineTS, an online TS algorithm for GLBs based
              on Bayesian one-pass online learning. Our method uses a Gaussian
              approximation induced by a local quadratic expansion of the
              log-likelihood, leading to a recursive posterior update that depends only
              on the current estimator and the current observation. We show that this
              Bayesian online one-pass estimator admits a high probability concentration
              bound in the bandit setting, which yields a frequentist regret bound of
              $\widetilde O(\sqrt{T})$ for OnlineTS over horizon $T$. Thus, OnlineTS
              combines strong statistical performance with computational efficiency
              without requiring such problem-dependent quantities as inputs to its
              implementation. Through numerical experiments, we demonstrate that
              OnlineTS achieves regret competitive with the existing GLB methods at
              substantially lower computational cost.
          - name: Taehyuk Ha
            name_ko: 하태혁
            affil: POSTECH CES
            title: >-
              How Learning Dynamics Shape Decoding in Masked Diffusion Models
            abstract: >-
              Diffusion Language Models have recently emerged as a promising alternative
              for reasoning, benefiting from bidirectional prediction and flexible token
              ordering at inference. However, how training shapes the usefulness of this
              flexibility remains unclear. In this paper, we study stage-wise learning
              dynamics in a masked diffusion model using a two-layer Transformer with a
              fixed output head on a graph-planning task. A local endpoint-first
              asymmetry under ordinary joint training motivates a framework separating
              \emph{endpoint preparation} from \emph{predecessor learning}. Within this
              framework, we establish a finite predecessor-risk decrease and derive
              risk-dependent reverse-circuit certificates. We derive conditions for
              endpoint reveal to bootstrap predecessor prediction and for
              top-probability and top-margin decoding to favor the reverse order,
              distinguishing sequence-level correctness from confidence-based selection.
              We also characterize order independence and confidence agreement when all
              mask-conditioned risks vanish. Together, our analysis relates stage-wise
              learning and internal computation to decoding preference and advantage.
          - name: Yejun Kim
            name_ko: 김예준
            affil: KAIST MAS
            title: >-
              Edge of Stability Occurs in Minimax Optimization
            abstract: >-
              The Edge of Stability (EoS) phenomenon is widely observed in minimization,
              where gradient methods continue to decrease the loss even while remaining
              near their stability thresholds, a behavior associated with a
              self-stabilization mechanism. Yet an analogous phenomenon has not been
              clearly identified in minimax optimization. In this paper, we formulate
              EoS for minimax optimization, demonstrate that it indeed occurs, and
              characterize the self-stabilization mechanism underlying it. We first
              define EoS for minimax optimization in terms of possibly complex dominant
              Jacobian eigenvalues reaching the boundary of the stability region. Using
              two-player zero-sum games, we observe minimax EoS for both Extragradient
              (EG) and Optimistic Gradient Descent Ascent (OGDA). However, when the
              dominant eigenvalues lie near the real axis, OGDA still exhibits EoS
              whereas EG does not. Finally, we generalize the self-stabilization
              mechanism to minimax methods and show how it explains these behaviors.
          - name: Heesang Ahn
            name_ko: 안희상
            affil: SNU DS
            title: >-
              Block-Sphere Vector Quantization
            abstract: >-
              Vector quantization is a fundamental primitive for scalable machine
              learning systems, enabling memory-efficient storage, fast retrieval, and
              compressed inference. Recent rotation-based quantizers such as EDEN,
              RabitQ, and TurboQuant have introduced strong guarantees and empirical
              performance, but the surrounding comparisons have been difficult to
              interpret because they rely on different distortion criteria, probability
              regimes, and implementation assumptions. As our first contribution, we
              provide a unified theoretical comparison of these methods and show that
              their relative advantages are criterion-dependent rather than absolute:
              EDEN and TurboQuant are favorable for MSE distortion, EDEN is also
              effective for expected inner-product distortion, and RabitQ provides
              strong high-probability control. This comparison further clarifies that
              EDEN provides particularly strong guarantees for expected distortion
              measures. As our second contribution, we introduce Block-Sphere
              Quantization (BlockQuant), a new rotation-based block quantization
              algorithm designed around the spherical geometry of randomly rotated
              vectors. Unlike coordinate-wise quantizers, BlockQuant quantizes blocks on
              the sphere, preserving the geometry of rotated embeddings more faithfully.
              We prove that this block-spherical design theoretically improves over the
              baselines considered in this paper for both reconstruction MSE and
              expected inner-product distortion. Our experiments on real embedding
              datasets and long-context LLM inference tasks show practical gains that
              are consistent with our theoretical improvements.
          - name: Hyunjun Choi
            name_ko: 최현준
            affil: SNU DS
            title: >-
              Topic-Aware Contextual Cascading Bandits
            abstract: >-
              We propose a contextual cascading bandit model in which the click
              probability at each position depends on both the displayed item and the
              topics of previously shown items. This captures how previously displayed
              topics affect later click probabilities, allowing different topic orders
              to induce different user responses. Unlike standard cascading bandits, the
              optimal cascade is no longer determined only by the selected set of items,
              since the ordering itself affects the expected reward. To address the
              resulting planning challenge, we reformulate cascade construction as a
              Markov decision process whose state summarizes the previously selected
              topics. Based on this formulation, we develop an optimism-based algorithm
              and prove a regret upper bound that decreases with the cascade length K, a
              phenomenon that had not been established even in order-insensitive
              contextual cascading bandits. We further provide a local regret lower
              bound showing that this decreasing dependence on K is intrinsic, and
              validate our theory through experiments with topic-order-dependent click
              probabilities.
          - name: Heeseong Kim
            name_ko: 김희성
            affil: HYU CS
            title: >-
              Gradient Descent with Large Step Size Restores Symmetry in Deep Linear
              Networks with Multi-Pathway
            abstract: >-
              Recent analyses of multi-pathway Deep Linear Networks use Gradient Flow to
              predict a "winner-takes-all" specialization in which path symmetry breaks
              and each feature concentrates in a single pathway. In this work, we show
              that discrete Gradient Descent (GD) with a large step size tells a
              different story. We prove that single-path solutions are sharp minima,
              whereas distributing signals across pathways reduces sharpness by a factor
              that decreases with both the number of pathways and depth. Consequently,
              while early training reproduces the depth-driven symmetry breaking
              predicted by GF, oscillations at the Edge of Stability subsequently
              override this tendency and drive the network into a re-balancing phase,
              where signals redistribute across pathways. Together, these results
              clarify how depth shapes pathway competition and explain why large-step GD
              favors shared representations rather than persistent single-pathway
              dominance.
          - name: Minsub Shin
            name_ko: 신민섭
            affil: KAIST MAS
            title: >-
              Local Exponential Stability of Mean-Field Langevin Descent–Ascent and
              Associated Particle System
            abstract: >-
              Mckean-Vlasov equations model various measure-evolving situations arising
              from various fields. In the field of machine learning, SGD dynamics of
              two-layer neural networks and forward passes of certain mean-field
              transformers are Mckean-Vlasov equations with specific interaction and
              potential kernels. In this presentation we classify the asymptoptic
              convergence rates of Mckean-Vlasov equations using Adams-Simon conditions.
              In the case of mean-field transformers with constant-times-identity
              parameters, the convergence rates are described explicitly by the
              parameters. This answers the recent question by Mun--Rosenzweig(2026).
          - name: Taehyun Hwang
            name_ko: 황태현
            affil: SNU DS
            title: >-
              Linear Ensemble Sampling with Smaller Ensembles
            abstract: >-
              Ensemble sampling is a practically attractive approach to randomized
              exploration, but existing theoretical guarantees for linear bandits
              require ensembles much larger than what its practical motivation would
              suggest. In particular, the sharpest existing analysis achieves an
              ensemble complexity of order d log T, leaving a log T gap from the
              intrinsic order-d ensemble-size barrier. We aim to narrow this gap by
              proposing an ensemble sampling algorithm that refreshes the ensemble only
              when the regularized Gram matrix changes substantially. This mechanism
              localizes the perturbation analysis to epochs with controlled Gram-matrix
              drift and reduces the sufficient ensemble size to order d log d + d log
              log T, while preserving the state-of-the-art regret for ensemble sampling
              with arbitrary bounded arm sets. We further show that, when the arm set is
              finite of cardinality K, the proposed algorithm achieves the sharper
              regret bound of order d√(T log K). To the best of our knowledge, this is
              the first ensemble-sampling guarantee that simultaneously recovers both
              canonical regret scalings known for randomized linear bandit algorithms.
              The algorithm also admits an anytime implementation without resetting past
              data, and experiments show that it remains competitive with baselines
              while using substantially smaller ensembles.
          - name: Shin So
            name_ko: 소신
            affil: YONSEI AI
            title: >-
              When More Data Slow Algorithmic Learning
            abstract: >-
              More training data can improve generalization, but does it always help a
              model learn faster? We investigate this question through controlled
              Transformer experiments on elementary cellular automata: binary sequences
              updated by a local rule mapping each cell and its two neighbors to its
              next value. We identify an intermediate-difficulty regime in which larger
              datasets delay both training-set fitting and generalization, measured in
              optimizer updates at a fixed batch size rather than epochs. Comparisons
              with easy and hard rules highlight a key distinction: the availability of
              lower-order predictive signals, which enable better-than-chance prediction
              from partial local inputs. Under the uniform population distribution, the
              intermediate rule provides neither output bias nor single-input predictive
              information. Sampling fluctuations nevertheless introduce these signals
              into smaller datasets, but the signals weaken as datasets grow. Biasing
              training inputs to introduce such signals accelerates generalization on
              unchanged, uniformly sampled validation inputs. We separately probe
              example-specific fitting by appending a fixed random bit string to each
              training target. Fitting these strings takes more updates as datasets
              grow, and the model can generalize on the cellular-automaton task before
              accurately reproducing them. Together, these observations suggest that
              weaker empirical signals and more example-specific associations may both
              contribute to the slowdown. We also observe similar slowdowns in dynamic
              programming and scratchpad multiplication. Our findings distinguish data
              sufficiency from learning speed: adding examples can delay algorithmic
              learning even when smaller datasets already support generalization.
          - name: Sanghoon Yoo
            name_ko: 유상훈
            affil: SNU DS
            title: >-
              Practical and Optimal Algorithm for Linear Contextual Bandits with Rare
              Parameter Updates
            abstract: >-
              We study linear contextual bandits under \emph{rare parameter updates}:
              the learner may incorporate reward feedback into its parameter estimate
              only at a small number of update times, while still observing contexts
              online and selecting actions sequentially. This viewpoint clarifies a
              practical distinction that is often blurred in the literature: many
              ``strictly batched'' methods additionally restrict \emph{within-interval
              context adaptivity}, meaning that the action rule inside an interval
              cannot depend on the \emph{sequence} of realized contexts/actions in that
              interval (beyond the current round's context). For linear contextual
              bandits, we propose two practical algorithms with only $\Ocal(\log\log T)$
              parameter updates. Our first algorithm \texttt{BLCE-G} attains
              minimax-optimal regret (up to polylogarithmic factors in $T$)
              \emph{simultaneously} in both the small-$K$ and large-$K$ regimes under a
              static schedule. Our second algorithm \texttt{BLCE} removes the near
              G-optimal design step---a dominant computational bottleneck in prior
              strictly batched static-grid methods---yet preserves minimax-optimal
              regret and achieves the lowest known runtime complexity among optimal
              algorithms. We further extend these rare-update and computational
              principles to generalized linear contextual bandits. Overall, our results
              yield minimax-optimal algorithms for linear contextual bandits and a
              near-optimal generalized-linear extension under $\Ocal(\log\log T)$
              parameter updates, while remaining computationally efficient in practice.
          - name: Youngwoo Song
            name_ko: 송영우
            affil: KAIST Physics
            title: >-
              A Statistical Physics Approach to Mitigating Latent Gradient Bias in SGD
              under Label Noise
            abstract: >-
              Statistical physics has offered valuable perspectives on machine learning
              (ML) through frameworks such as spin-glass theory and stochastic dynamics.
              An important challenge is to translate these perspectives into practical
              methods that not only explain the learning dynamics of deep neural
              networks (DNNs) but also improve their performance on imperfect datasets.
              In this work, we take a statistical physics approach to learning from
              datasets corrupted by label noise. We analyze the dynamics of stochastic
              gradient descent (SGD) and identify a latent gradient bias induced by
              corrupted labels that impairs the generalization of DNNs. To address this
              problem, we incorporate stochastic resetting into SGD. Through theoretical
              analysis and empirical evaluation, we demonstrate that stochastic
              resetting mitigates the adverse effects of this bias, leading to improved
              generalization performance. Our findings provide insights into the
              learning dynamics of DNNs, highlighting the potential to both analyze and
              enhance ML methods through the lens of statistical physics.
