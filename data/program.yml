        speakers:
          - name: Namhoon Lee
            role: Prof.
            role_ko: 교수
            name_ko: 이남훈
            photo: namhoon-lee.jpg
            affil: POSTECH
            talk: "FRESCO: A Novel Consistency Control for Asynchronous Pipeline Parallel Training"
            abstract: >-
              Asynchronous pipeline parallelism can accelerate distributed model training,
              but suffers from instability caused by inconsistent gradient computations.
              We identify a fundamental source of this inconsistency: error signals are
              coupled to forward-time features, not just parameter states. This means that
              parameters may evolve as long as they preserve forward-equivalence.
              Leveraging this insight, we introduce FRESCO, which frames asynchronous
              updates as a constrained optimization problem: it finds the minimal update
              modification that acts trivially on the activation subspace. Thus, it serves
              as a principled generalization beyond the usual synchronous--asynchronous
              dichotomy: subspace-level protection preserves gradient validity without
              synchronization stalls, unconstrained-asynchrony instability, or memory
              overhead that works against pipeline scaling. We demonstrate that FRESCO
              consistently outperforms representative asynchronous baselines in LLM
              pre-training, with the gains most pronounced under deep pipelines and high
              inconsistency levels. Moving beyond the current limitations, FRESCO
              establishes a new foundation for high-utilization pipeline parallel
              training, providing a scalable path for large-model development on diverse,
              resource-constrained systems.
            bio: >-
              Namhoon Lee is an Associate Professor of CSE and AI at POSTECH where he
              leads the Computational Optimization Lab. His research is focused on
              large-scale machine learning, which includes training and running
              large-scale foundation models. Previously he was a visiting researcher at
              Google, ISTA, EPFL, and ANU, and has received his PhD from Oxford
              University.
            note: >-
              replaced Sejun Park (Korea). Form (8/26, resubmitted): free in all four Day
              1 sessions and Day 2 morning.
            home: https://namhoonlee.github.io/

            links:
              lab: https://opt.postech.ac.kr/
          - name: Jaeho Lee
            role: Prof.
            role_ko: 교수
            name_ko: 이재호
            photo: jaeho-lee.jpg
            affil: POSTECH
            talk: On the Scale Bias of Neural Network Training
            abstract: >-
              How do we initialize the neural network weights? Classic ideas have
              focused on stabilizing the activation distributions of the networks, so
              that one can train deeper nets without exploding or vanishing gradients.
              In this talk, we study how the initialization scale can affect the
              efficiency of model training. In particular, we describe modern theories
              on how the weight scale shapes the training speed and the generalization
              capabilities of the model, and recent breakthroughs in characterizing the
              optimal speed-generalization tradeoff point.
            bio: >-
              Jaeho Lee is an associate professor at the POSTECH EE, where he leads
              Efficient Learning (EffL) Lab. He is mainly interested in designing
              theories and algorithms for making ML more efficient.
            # He is sitting in a Day 2 block and has ticked nothing on Day 2.
            note: >-
              Form (8/25): Day 1 only — all four sessions. This is one of them.
            # Was "theory of KD"; the title he sent is about initialization scale.
            topic: initialization scale
            home: https://jaeho-lee.github.io/
            links:
