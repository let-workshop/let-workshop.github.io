          # Confirmed 2026-08-19 from the shortlist for this slot. A
          # postdoc rather than a professor, so the card says Dr.
          - name: Jongyeong Lee
            role: Dr.
            role_ko: 박사
            name_ko: 이종영
            photo: jongyeong-lee.jpg
            affil: KIST
            links:
              scholar: https://scholar.google.com/citations?user=ZNLjOlEAAAAJ
            talk: "Toward Simple Best-of-Both-Worlds Algorithms: Insights from Follow-the-Perturbed-Leader"
            abstract: >-
              In online learning, a best-of-both-worlds (BOBW) policy provides strong
              performance guarantees in both stochastic and adversarial environments.
              While much of the existing literature has established such guarantees within
              the follow-the-regularized-leader framework, Follow-the-Perturbed-Leader
              (FTPL) offers a conceptually simple and often computationally attractive
              alternative based on randomized decision rules.


              In this talk, I will review our recent progress on establishing BOBW
              guarantees for FTPL across several online learning problems, with particular
              emphasis on multi-armed bandits and structured feedback settings. I will
              discuss the main ideas behind these results, including adaptive learning
              rates, surrogate probabilities, perturbation-based stability analysis, and
              efficient loss estimation. Rather than focusing on a single result, the talk
              will discuss broader insights gained from this line of work, including how
              simple randomized decision rules can achieve strong theoretical guarantees
              while maintaining computational efficiency.
            bio: >-
              Jongyeong Lee is a postdoctoral researcher at KIST. His research focuses on
              statistical learning theory, with a particular focus on sequential
              decision-making, bandit algorithms, and online learning. A central goal of
              his research is to develop simple and computationally efficient learning
              algorithms with strong theoretical guarantees. He received his Ph.D. in
              Computer Science from The University of Tokyo under the supervision of Prof.
              Masashi Sugiyama.
            note: >-
              Form (8/25, resubmitted): free in every session on both days, the new
              Day 1 16:40 slot included.
            home: https://jongyeong.github.io

