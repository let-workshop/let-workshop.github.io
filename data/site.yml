# ─────────────────────────────────────────────────────────────
# Site-wide facts. Everything here feeds <head>, the hero, the
# info bar and the footer. Change it here, never in main.html.
# ─────────────────────────────────────────────────────────────

name: LeT Workshop
full_name: Learning Theory Workshop
year: 2026
# Blank: the sheet said "1st Learning Theory Workshop" and the 1st is the same
# claim the pill was making. Fill it in and the prefix comes back.
edition: ""

# No pill above the title. It said "Inaugural · Annual Gathering", and both
# halves were claims the first edition of a workshop cannot make for itself —
# annual is something you become. Give `eyebrow` a value and it comes back.
eyebrow: ~
eyebrow_ko: ~

# What sits behind the hero.
#   art    the campus written out in formulas, one glyph-block per superpixel.
#          Regenerate with tools/formula-lut.py then tools/formula-art.py; the
#          photograph itself is not drawn, because this *is* the photograph.
#   flow   the drifting field used as a stencil: the writing moves, and the
#          photograph shows only through it, fixed in place at its own
#          resolution. Tone is the picture's tone times the local density of
#          the writing, so the picture keeps its contrast without having to be
#          encoded in which formula was chosen.
#   drift  the earlier treatment — the blurred campus with a tilted field of
#          formulas sliding across it, drawn on top rather than cut out of it.
# Never two of them at once: two layers of formulas over each other make
# neither legible, and the picture disappears into the noise.
hero_background: art

# No stated theme this edition. The programme says what the workshop is
# about better than a line above it did, and the line was competing with
# the name for the same glance. Fill this in and it comes back in both
# places at once — under the title on the page, and as the second rail
# down the poster's left edge.
# theme: Deep Learning Theory, Uncertainty Quantification, and Bandits
theme: ""
dates: October 7–8, 2026
venue: POSTECH
city: Pohang
country: South Korea
# Fallback for local builds only. In CI the deployed URL is derived from
# GITHUB_REPOSITORY, so the same commit is correct on every target — the live
# repo and the staging repo do not need separate histories.
#   live     https://let-workshop.github.io/2026/
#   staging  https://dongyeoplee2.github.io/kolt-page-test-private/2026/
url: https://let-workshop.github.io/2026/

# One-liners reused across <meta> tags (search results, link previews).
description: >-
  LeT Workshop — the Learning Theory Workshop. A meetup for the
  machine learning theory community in Korea. POSTECH, Pohang · October 7–8, 2026.
tagline: Learning Theory Workshop · POSTECH, Pohang · October 7–8, 2026
blurb: A meetup for the machine learning theory community in Korea.

analytics_id: G-DN4LGBW9YN


# Buttons at the foot of the hero. An entry with no `href` renders disabled —
# present, so people know it is coming, but plainly not yet clickable.
#
# `primary` is the filled pill; everything else is an outline. Registration
# keeps the fill even while it is disabled — it is what people came for, and
# the "opens soon" note under it carries the fact that it is not live yet.
#
# `opens_at` is the third state: the URL is here, and the hour it starts
# working is here, and the page decides which of the two to show. Both are
# rendered and one is hidden, so the swap is a flag rather than a fetch — a
# page left open across the hour flips itself, and one loaded a second later
# is already open with nothing to wait for. `note` is what it says once it is
# live; `shut_note`, what it says until then.
hero_actions:
  - label: Registration
    label_ko: 참가 신청
    href: https://docs.google.com/forms/d/e/1FAIpQLSe4zlakGy6_rJ6KcT_ovDc1dD08mYEoOOFTeuiBm9hxfXGy-w/viewform
    # Open now, so there is no hour to wait for. The two lines that schedule it
    # stay here rather than in the history: setting them again is what shuts
    # the button until a stated time, and the offset is the part that is easy
    # to leave off — a bare "18:00" means six in the evening wherever the
    # reader happens to be.
    #
    # opens_at: 2026-08-24T18:00:00+09:00
    # shut_note: Opens August 24, 18:00
    # shut_note_ko: 8월 24일 18시 오픈
    # Two facts, because the date on its own is the one that misleads. A form
    # with a closing date reads as one you can come back to until then, and
    # this one shuts the moment the room is full — which, at a venue with a
    # fixed number of seats, may well be first. Whichever comes first is the
    # deadline, so both are named.
    note: Until September 1, or until full
    note_ko: 9월 1일까지 · 정원 차면 조기 마감
    primary: true
  - label: See speakers
    label_ko: 연사 보기
    href: "#speakers"

# Sticky top bar. Each href is a section id on the page; the link highlights
# itself as you scroll past its section.
# Order must match the order the sections appear on the page — the links
# highlight on scroll, so a nav out of step reads as jumping backwards.
nav:
  - { label: About, label_ko: 소개, href: "#about" }
  - { label: Speakers, label_ko: 연사, href: "#speakers" }
  - { label: Program, label_ko: 프로그램, href: "#program" }
  - { label: Organizers, label_ko: 조직위원회, href: "#organizers" }
  - { label: Travel Info, label_ko: 오시는 길, href: "#venue" }
  - { label: Poster, label_ko: 포스터, href: "#poster" }

# Institution logos, shown greyscale in a strip under the organisers.
#
# The files are NOT in this repo — download the official assets and drop them
# into static/logos/. Both universities publish brand kits with usage rules,
# and neither logo is ours to redistribute:
# Both of these moved and neither redirects — they 404 as of 2026-08-27, so
# start from the university's own site and find the identity page from there.
#   POSTECH  https://www.postech.ac.kr/
#   KAIST    https://www.kaist.ac.kr/kr/
#   NRF      https://eng.nrf.re.kr/
# Prefer SVG, or a PNG at least 200px tall with a transparent background.
# Delete this whole block and the strip disappears.
sponsors:
  # Shown as a section of their own at the foot of the page rather than as a
  # strip in the footer. In the footer they were chrome, at 20px and dimmed;
  # here they are the last thing the page says, and they are shown as their
  # owners drew them — a mark greyed out reads as a placeholder for a sponsor
  # rather than as one.
  title: Sponsors
  title_ko: 후원
  # The acknowledgement the grant requires, in the wording it requires. Under
  # the marks rather than over them: the marks say who, this says under which
  # grant, and nobody reads the second before the first.
  note: >-
    This workshop was supported by the National Research Foundation of Korea
    (NRF) grant funded by the Korea government (MSIT) (Development of an
    End-to-End Design and Validation Framework for Mathematically Principled
    Next-Generation AI Architectures and Learning Algorithms, RS-2026-25612350).
  note_ko: >-
    이 워크샵은 정부(과학기술정보통신부)의 재원으로 한국연구재단의 지원을 받아
    수행됨 (수학적 원리 기반 차세대 AI 구조·학습 알고리즘의 전주기 설계·검증
    프레임워크 개발, RS-2026-25612350)
  label: Sponsoring and participating institutions
  # `file` is the 132px-tall mark this section draws at 44; `small` is the
  # 66px one the hero puts beside the buttons at 22. Both written by
  # tools/prep-logo.py, which takes one source and produces the pair.
  # `ratio` and `baseline` are what let the three be drawn with their letters
  # the same size rather than their boxes the same height — which is what a row
  # of logos usually does, and is wrong here because the marks carry different
  # furniture. KAIST's letters are 62% of its box, POSTECH's 58% (there is a
  # line of small type under the word) and the NRF's 36%, most of its box being
  # the arc above them. Set to one height the NRF read at half the size of the
  # other two.
  #
  #   ratio     box height per unit of letter height — the page asks for a
  #             letter height and multiplies
  #   baseline  where the letters sit on their box, as a fraction from the top,
  #             so the three can be dropped onto one line
  #   nudge     an optical correction on top of the measurement. Equal cap
  #             heights are equal by measure, not to the eye: POSTECH's mark is
  #             a very wide word and reads as the big one whatever its letters
  #             measure, which leaves KAIST looking undersized beside it. This
  #             is the only place to put that judgement, and it stays separate
  #             from `ratio` so the measurement is never quietly overwritten.
  #
  # Both are measured, not guessed: tools/prep-logo.py prints them for whatever
  # you feed it.
  logos:
    - { name: KAIST, file: kaist.webp, small: kaist-sm.webp, ratio: 1.618, baseline: 0.618, nudge: 1.12, url: https://www.kaist.ac.kr/en/ }
    - { name: POSTECH, file: postech.webp, small: postech-sm.webp, ratio: 1.714, baseline: 0.583, url: https://www.postech.ac.kr/eng/ }
    - { name: NRF, file: nrf.webp, small: nrf-sm.webp, ratio: 2.779, baseline: 0.784, url: https://eng.nrf.re.kr/ }

# The particulars under the hero title. `icon` names a symbol in the inline
# sprite: cal, pin, globe, mic. `mono` sets the value in the monospace face —
# every cell here is a fact rather than prose, so they all take it and read as
# one row of data. `href` makes the value a link.
infobar:
  - key: Date
    key_ko: 날짜
    icon: cal
    mono: true
    value: October 7–8, 2026
    value_ko: 2026년 10월 7–⁠8⁠일 # word joiners (U+2060) inside 7–8일: a line may break after an en dash and between a digit and a Hangul syllable, and both stranded the 일
    countdown: true # appends (D-xx), counted from the programme's first day
    note: 2 days (Wed–Thu)
    note_ko: 2일간 (수–목)
  - key: Location
    key_ko: 장소
    icon: pin
    mono: true
    value: POSCO International Center
    value_ko: 포스코국제관 # matches venue.yml's name_ko
    href: "#venue" # the section that says how to get there
    note: POSTECH, Pohang
    note_ko: 포항공과대학교, 포항
  - key: Language
    key_ko: 언어
    icon: globe
    mono: true
    value: Korean
    value_ko: 한국어
  - key: Format
    key_ko: 형식
    icon: mic
    mono: true
    value: Talks · Tutorials · Posters
    value_ko: 강연 · 튜토리얼 · 포스터
    note: No formal peer review
    note_ko: 정식 논문 심사 없음

# Korean names for the affiliations used in program.yml and organizers.yml.
# A lookup rather than an `affil_ko` on each person: six institutions cover
# seventeen people, and a typo in one place is easier to find than in ten.
# An affiliation missing from here simply shows its romanised form in both
# languages, which is the right fallback for a foreign institution.
affiliations:
  KAIST: 한국과학기술원
  POSTECH: 포항공과대학교
  UNIST: 울산과학기술원
  SNU: 서울대학교
  Yonsei: 연세대학교
  CAU: 중앙대학교
  KIST: 한국과학기술연구원

# The footer used to end "— program subject to change." The programme is not
# subject to change any more: the days and the hours are settled and the one
# thing still open says so for itself, beside the Program heading. Give this a
# value and the em dash and the note come back.
footer_note: ~

# ─────────────────────────────────────────────────────────────
# Build variants. Paths are relative to the build directory
# (_site/ by default). `python3 build.py` writes every one of
# them; `python3 build.py public` writes just one — and that is
# what CI deploys, so `invite` and `internal` never go live.
# ─────────────────────────────────────────────────────────────
variants:
  # The page that goes out to participants. Deployed.
  public:
    output: 2026/index.html
    anonymize: false # show speaker names in the programme
    candidates: false # hide the "potential speakers" shortlist
    analytics: true
    noindex: true # drop this once the page should be searchable

  # The page linked from speaker invitations. Same programme as the
  # public page, names and all — it differs only in carrying no
  # analytics. The anonymised variant it used to be is still
  # available: set `anonymize: true` to hide every speaker name and
  # replace each block with "N talks · M min each".
  invite:
    output: 2026/invite.html
    anonymize: false
    candidates: false
    analytics: false
    noindex: true

  # Organisers' working copy. Never deployed — it carries the
  # candidate shortlist.
  internal:
    output: 2026/internal.html
    anonymize: false
    candidates: true
    analytics: false
    noindex: true

# ─────────────────────────────────────────────────────────────
# The printed sheet, shown under the travel section. `image` is what
# the page displays and `full` is what clicking it opens; both live in
# static/ and are made from the A2 export with tools/poster.py. Delete
# this block and the section disappears.
# ─────────────────────────────────────────────────────────────
poster:
  title: Poster
  title_ko: 포스터
  # Two sheets, the same poster printed either way round. `sheets` is what the
  # page shows; the first is the one that leads.
  # Two downloads under each sheet, not one. The full-size file is 16MB, and a
  # poster is often wanted as an attachment — on a travel claim, in a mail to a
  # department — where 16MB is the difference between sending it and not. The
  # smaller file is the one already on the page: 1200px, which still reads and
  # still scans.
  sheets:
    # `image` is what the page draws, `small` is what tapping it opens. The
    # 2800px `full` files went with the download row: nothing linked to them,
    # and shipping 34MB nobody can reach is worse than regenerating them —
    # tools/export-poster.py writes them into the print folder either way.
    - image: poster-2026.png
      small: poster-2026-small.jpg
      label: Dark
      label_ko: 어두운 판
    - image: poster-2026-light.png
      small: poster-2026-light-small.jpg
      label: Light
      label_ko: 밝은 판
  # One language only, and plain text. `alt` is an attribute, and the bilingual
  # helper writes a pair of spans — markup inside an attribute ends it early and
  # spills the rest onto the page.
  alt: LeT Workshop A2 poster — the POSTECH campus drawn in learning-theory formulas
  caption: A2 · 420 × 594 mm
  caption_ko: A2 · 420 × 594 mm
  # No download row under the sheets any more — tapping one opens it, at the
  # size that opens quickly. These are the labels that row used, kept in case
  # it comes back rather than deleted along with it.
  # download_small: Small
  # download_small_ko: 작은 크기
  # download: Full size
  # download_ko: 원본 크기

# ─────────────────────────────────────────────────────────────
# Redirect stubs, written on every build. GitHub Pages has no
# server-side redirects, so these are meta-refresh + canonical
# pages. Point `index.html` at the newest edition each year.
# ─────────────────────────────────────────────────────────────
redirects:
  # Relative, so the stub works whether the site sits at a domain root or under
  # a project path like /kolt-page-test-private/.
  - output: index.html
    to: 2026/
    label: LeT Workshop
