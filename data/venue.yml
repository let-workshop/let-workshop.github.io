name: POSCO International Center
name_ko: 포스코국제관
campus: POSTECH campus, Pohang
address: 77 Cheongam-ro, Nam-gu, Pohang, Gyeongsangbuk-do, South Korea
address_ko: 경상북도 포항시 남구 청암로 77

# Booked rooms. `detail` is shown under the name.
#
# Floors and seat counts are POSTECH's own, from the 시설 현황 table at
# postech.ac.kr/kor/college-life/posco_international_hall.do and corroborated
# by the 복지회 listing at dining.postech.ac.kr/store/. Note 98 seats, not the
# round 100 this used to say — 98석 is the published figure.
# A heading of its own, and both rooms set the same: the sessions room and the
# hall dinner is in are two facts of one kind here, and the page ranks them by
# order rather than by weight.
rooms_title: Rooms
rooms_title_ko: 공간
# The mark is what the room is for, and it matches the programme's: the talks
# are 🎤 there and the banquet 🥂, so the same two say which room is which here.
# Without them these two rows were the only ones in the card with nothing on
# the left, next to a transport list where every line opens with a vehicle.
rooms:
  - name: Grand Conference Room · 대회의실
    icon: "🎤"
    detail: 1F · 98 seats
  - name: Banquet Hall · 연회장
    icon: "🥂"
    detail: 2F · 200 seats

# Building centre from OpenStreetMap (Overpass): 포스코국제관 / POSCO
# International Center, 36.0139836, 129.3209046.
lat: 36.01398
lon: 129.32090

# Which map to embed. Tried in this order, falling back as each turns out to
# be unconfigured, so the section is never blank.
#
#   google          Google Maps. Uses the official Maps Embed API when
#                   `google_api_key` is set — that is the variant most sites
#                   use, and the Embed API is free with no usage cap. Without a
#                   key it falls back to the keyless embed URL, which works
#                   because The trick is to use
#                   the URL Google's own redirect lands on — the intermediate
#                   301 carries x-frame-options: SAMEORIGIN, the final
#                   /maps/embed does not, so framing it directly works. build.py
#                   assembles it from lat/lon, nothing to paste.
#   kakao_roughmap  Kakao's "지도 퍼가기" embed. NO developer account needed:
#                   map.kakao.com -> search 포스코국제관 -> 공유 -> 퍼가기 ->
#                   copy the `timestamp` and `key` out of the snippet it gives
#                   you and paste them below. Takes about 30 seconds.
#   kakao           Kakao Maps JS SDK. Needs a JavaScript key from
#                   developers.kakao.com, with every domain the site is served
#                   from registered under Platform -> Web
#                   registered under Platform -> Web. Domain-restricted, so
#                   publishing the key is expected. Pans and zooms properly.
#   leaflet         Fallback. CARTO tiles, self-hosted Leaflet, no key at all.
#
# Naver only offers the equivalent through NCP (console.ncloud.com), which
# wants billing registered even on the free tier — Kakao is the lighter route.
map:
  provider: kakao
  zoom: 16 # Leaflet zoom level; higher = closer
  google_api_key: ""
  # Or paste the pb value out of Google Maps -> Share -> Embed a map. That
  # route needs no API key and gives the full interactive widget; the short pb
  # build.py can assemble from coordinates alone is only a static preview.
  google_embed_pb: ""
  kakao_app_key: "5803d6308bc4104171643ea0cf1d9377"
  kakao_level: 3 # Kakao level; lower = closer
  kakao_roughmap:
    timestamp: ""
    key: ""
  tiles:
    # CARTO Voyager: modern styling that still labels buildings and roads.
    url: https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png
    subdomains: abcd
    max_zoom: 20
    attribution: >-
      &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>
      contributors &copy; <a href="https://carto.com/attributions">CARTO</a>

# Small links under the venue name. `{lat}`/`{lon}` are substituted in.
# Just the brand: the row already sits under the map, so "Map" on each label
# was saying the same thing three times.
map_links:
  - label: Naver
    icon: naver
    url: https://map.naver.com/p/search/포스코국제관
  - label: Kakao
    icon: kakao
    url: https://map.kakao.com/link/map/포스코국제관,{lat},{lon}
  # TMAP has no public web map, only the app — but this landing page needs no
  # developer key and does the right thing on both: it opens the app on a
  # phone, and on a desktop it explains itself and offers the stores, rather
  # than a bare tmap:// link that fails silently. goalx is the longitude.
  - label: TMAP
    icon: tmap
    url: https://www.tmap.co.kr/tmap2/mobile/route.jsp?goalname=포스코국제관&goalx={lon}&goaly={lat}

# Each entry becomes a row under the map. Add rail/bus/air details here once
# they are settled — leave the list empty and the block disappears.
# How to arrive. `title` heads the list; without one the rows sat straight
# under the address with nothing saying what they were.
getting_here_title: Transport
getting_here_title_ko: 교통
# Appended to each `stop`, so the data holds the name and only the name.
stop_word: stop
stop_word_ko: 정류장
#
# A journey is written out as the stops it passes through rather than as a
# sentence about them. "Bus 5000 to Pohang Terminal (intercity), change to 207"
# is a route with a transfer in the middle, and a reader arriving at Pohang
# station has to parse the sentence back into one before it is any use; drawn
# as stops and legs it is the shape they are already looking at in a maps app.
#
# `total` is door to door for the whole journey. A leg carries its own `time`
# only where that time is known on its own — the 207 into campus is ten
# minutes, and the rest of the first journey is one bus plus however long the
# transfer takes, which is not two numbers we have.
getting_here:
  # `by` and `taxi` are the line under each name: which bus, and what it costs
  # to skip it. Both are worth a row on their own and neither is worth a row on
  # its own — the reader is choosing between them.
  #
  # The fares say 약 and mean it. Pohang's meter went to a 4,500원 base on 20
  # January 2026 at 100원 per 128m, and the one published door-to-door figure
  # anywhere is 10,000–12,000원 from the station, from before that rise. The
  # other two are that figure carried across by distance. They are for deciding
  # whether to wait for a bus, not for an expense claim.
  #
  # Bus numbers and times are POSTECH's own, from the 오시는 길 page at
  # postech.ac.kr/kor/university-introduction/direction.do.
  # Pohang has two bus terminals 2.5km apart — the intercity one, whose own
  # name is 포항터미널, in Sangdo-dong, and the express one in Haedo-dong. The
  # 207 serves the intercity terminal, so it is named rather than left as "the
  # bus terminal", which is the ambiguous half of the pair; and the express one
  # gets a route of its own rather than being folded into it, because arriving
  # at the wrong one of a pair 2.5km apart is exactly the mistake a travel page
  # exists to prevent.
  # lat/lon turn each journey into a link: build.py hands them to Naver's
  # directions with both ends already filled in, so the card can be read and
  # then followed. All three from OpenStreetMap (Overpass), the same source
  # the venue's own pin came from. `mode` is what Naver should plan for.
  - from: Pohang KTX station
    from_ko: 포항역
    by: Bus 5000 → 207
    by_ko: 5000번 → 207번
    taxi: taxi 20–30 min, about ₩12,000
    taxi_ko: 택시 20–30분 · 약 12,000원
    lat: 36.0712333
    lon: 129.3426784
    naver_name: 포항역
    # One emoji per stop, saying what kind of place it is. On the stops rather
    # than on the legs: every leg here is a bus, so a bus on each of them is a
    # column of the same picture, while the stops are a station, a terminal and
    # a campus — three different places, which is the thing worth marking.
    icon: "🚅"
    # The stop itself, which is not the same as the place. Pohang station has
    # more than one, and the one the 5000 leaves from is the city-bound side.
    # Names are POSTECH's own, from the 오시는 길 page.
    stop: Pohang Station, city-bound
    stop_ko: 포항역(시내행)
    total: 1 hr
    total_ko: 1시간
    legs:
      - via: Bus 5000
        via_ko: 5000번
        to: Pohang Terminal (intercity)
        to_ko: 포항터미널(시외)
        stop: Intercity Bus Terminal
        stop_ko: 시외버스터미널
        icon: "🚌"
        change: true # the transfer, drawn as a hollow stop
      - via: Bus 207
        via_ko: 207번
        time: 10 min
        time_ko: 10분
        to: POSTECH
        to_ko: 포항공과대학교
        stop: POSTECH
        stop_ko: 포스텍
        icon: "🏫"
    # The alternative to the whole journey, not to any one leg of it.
    alt: or taxi, 20–30 min
    alt_ko: 또는 택시 20–30분
  # The other terminal, and the 207 does reach POSTECH from it — just not from
  # the terminal itself. Its stop list has nothing in 해도동; you walk 573m to
  # 홈플러스 and catch it there, which is why every route description that only
  # reads stop lists concludes there is no bus and says "take a taxi".
  #
  # Forty-two minutes door to door, twenty-five of them walking, against about
  # twenty in a taxi. Both are worth knowing and the sheet gives both.
  - from: Pohang Express Bus Terminal
    from_ko: 포항고속버스터미널
    by: Walk 573 m → bus 207
    by_ko: 도보 573m → 207번
    taxi: taxi 20 min, about ₩8,000
    taxi_ko: 택시 20분 · 약 8,000원
    icon: "🚌"
    lat: 36.0280334
    lon: 129.367615
    naver_name: 포항고속버스터미널
    total: 42 min
    total_ko: 42분
    legs:
      - via: On foot, 573 m
        walk: true
        via_ko: 도보 573m
        time: 11 min
        time_ko: 11분
        to: Homeplus
        to_ko: 홈플러스
        stop: Homeplus
        stop_ko: 홈플러스
        icon: "🚌"
        change: true
      - via: Bus 207
        via_ko: 207번
        time: 15 min
        time_ko: 15분
        to: POSTECH
        to_ko: 포스텍
        stop: POSTECH
        stop_ko: 포스텍
        icon: "🚏"
        change: true
      - via: On foot, 758 m
        walk: true
        via_ko: 도보 758m
        time: 14 min
        time_ko: 14분
        to: POSCO International Center
        to_ko: 포스코국제관
        icon: "🏫"
    alt: A different terminal from Pohang Terminal (intercity), 2.5 km away. Twenty-five of those 42 minutes are on foot — a taxi is about 20.
    alt_ko: 포항터미널(시외)과는 2.5km 떨어진 다른 터미널입니다. 42분 중 25분이 도보이며, 택시로는 약 20분입니다.

  - from: Pohang Terminal (intercity)
    from_ko: 포항터미널(시외)
    by: Bus 207
    by_ko: 207번
    taxi: taxi 10 min, about ₩6,000
    taxi_ko: 택시 10분 · 약 6,000원
    icon: "🚌"
    lat: 36.0134405
    lon: 129.349645
    naver_name: 포항시외버스터미널
    stop: Intercity Bus Terminal
    stop_ko: 시외버스터미널
    total: 10 min
    total_ko: 10분
    legs:
      - via: Bus 207
        via_ko: 207번
        to: POSTECH
        to_ko: 포항공과대학교
        stop: POSTECH
        stop_ko: 포스텍
        icon: "🏫"

# Everything about arriving that is not a route. Same list, no stops.
#
# Parking used to sit here reading "TBD", which is the one thing a row can say
# that is worse than saying nothing: it takes a line of the card to tell you it
# has no answer. POSTECH charges campus-wide since 1 September 2026, and the
# only rate anyone has published came from the student paper paraphrasing 총무팀
# months before it took effect — no official notice, nothing on whether a
# visitor registers the car first. Call 054-279-8500, and when there is a real
# figure it can come back as a row that says it.
getting_here_notes: []

# Where to sleep. The pattern every recent POSTECH workshop has used: a small
# block of rooms in the building the workshop is in, given out until they run
# out, and a list of places nearby for everyone after that — booked by the
# guest, not by us, because a room we cannot guarantee should not be promised.
#
# `first_come` is the on-campus allocation; `nearby` are the alternatives, each
# with how long it takes to reach the venue. Times are by taxi unless the note
# says otherwise. No rates here on purpose: they move, and a stale price on a
# programme page is worse than no price.
accommodation:
  title: Accommodation
  title_ko: 숙소
  # Beside the heading, in the small type Transport uses for the same job: what
  # the list under it is. Nothing here is booked for anybody, so "숙소" alone
  # left it open whether these were arrangements or suggestions.
  #
  # 숙소 rather than 호텔 on the Korean side: the first entry is the guest house
  # on the campus, which is not a hotel.
  note: hotel recommendations
  note_ko: 추천 숙소
  # The guest house is not on this page at all. Its rooms go to the project's
  # researchers and the invited speakers, so it is not somewhere a reader can
  # book — and saying so under a heading that means "places to book" put the
  # workshop's own arrangements in front of people they do not concern. Those
  # who it does concern are told directly. The hotels below are unaffected:
  # they are what this list is for.
  nearby_note: ~
  nearby_note_ko: ~
  # Two facts per place, not a table: how long by car, and the bus if there is
  # one. 207 is the route that matters here — it runs the seafront to POSTECH —
  # and every one of these is on it.
  nearby:
    - name: Hotel Yeongildae
      icon: "🏨"
      name_ko: 호텔영일대
      travel: 5 min by car
      travel_ko: 차량 약 5분
      transit: Yeongildae stop, bus 207, about 4 stops
      transit_ko: 영일대 정류장 → 207 → 포스텍, 약 4정거장
      map: https://map.naver.com/p/search/포항%20호텔영일대
    - name: Nobleon Hotel
      icon: "🏨"
      name_ko: 노블리온 호텔
      travel: 7 min by car
      travel_ko: 차량 약 7분
      transit: Pohang Terminal (intercity), bus 207, about 15 min
      transit_ko: 포항터미널(시외) → 207 → 포스텍, 약 15분
      map: https://map.naver.com/p/search/포항%20노블리온%20호텔
    - name: Hotel Lahan Pohang
      icon: "🏨"
      name_ko: 라한호텔 포항
      travel: 15–20 min by car
      travel_ko: 차량 약 15–20분
      transit: Yeongildae Beach, bus 207, no change
      transit_ko: 영일대해수욕장 → 207 → 포스텍, 환승 없음
      map: https://map.naver.com/p/search/라한호텔%20포항
