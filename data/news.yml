# Notices. The section is drawn straight after About and is left out of the
# page entirely when `notices` is empty, so taking the board down is emptying
# this list rather than editing the template.
#
# A board, not a schedule. Each entry is a thing that was announced and the
# moment it was announced — nothing here runs from one date to another, and
# nothing here has a status of its own. Words like 연장 and 종료 belong to what
# was said, so they are written into the text the way they were posted.
#
# Newest first — the order here is the order on the page. One box, one line to
# a notice: a notice is a line in a log, not a chapter, and three cards in a
# column made three small announcements look like three sections of the page.
#
# Each wants both languages. A notice is the one kind of text on this page that
# somebody acts on, and acting on a half-read sentence is how people turn up to
# a meal they have no ticket for.
#
#   at:     when it was announced, as it was written. Also what the dot beside
#           it reads: lit while the notice is inside its week, grey after. The
#           same week lights the dot on the tab — see FRESH_DAYS in build.py.
#
# `href` on an action may be left empty while a form is still being set up: the
# row then carries the `wait` line instead of a link.
title: Notices
title_ko: 공지

notices:
  - at: "2026-10-09 00:30"
    body: >-
      [Closed] The workshop ran over the two days and has finished. Thank you
      to everyone who came, spoke, chaired and stood by a poster. The
      photographs from both days are up in the gallery.
    body_ko: >-
      [종료] 2일간의 워크숍이 무사히 마무리되었습니다. 참석해 주신 모든 분과
      발표·좌장·포스터로 함께해 주신 분들께 감사드립니다. 양일간의 사진은
      갤러리에 올려 두었습니다.
    action:
      label: Gallery
      label_ko: 갤러리 보기
      href: "#gallery"
      wait: coming shortly
      wait_ko: 준비 중

  - at: "2026-10-07 08:30"
    body: >-
      [Closed] Sign-up for the audit places is closed — they have all been
      taken. Thank you to everyone who wrote in.
    body_ko: >-
      [종료] 비등록 청강석 신청이 마감되었습니다. 신청해 주신 모든 분께
      감사드립니다.

  - at: "2026-10-06 23:59"
    body: >-
      [Extended] Cancellations have freed five more non-registered audit places
      — sessions only, with no meals and no accommodation. Apply through the
      form below. Places are taken in the order they are applied for and may
      close early once they are full.
    body_ko: >-
      [연장] 일부 등록 취소로 인해, 식사 및 숙소 지원 없이 세미나에만 참여하는
      비등록 청강석이 총 5석 추가로 마련되었습니다. 참가를 희망하시는 분께서는
      아래 구글 폼을 통해 신청해 주시기 바랍니다. 선착순으로 접수하며, 정원
      충족 시 조기 마감될 수 있습니다.

  - at: "2026-09-01 23:59"
    body: >-
      [Closed] Every registered participant was emailed the survey password, so
      that anyone can edit their own RSVP answers — poster details included. If
      the password did not reach you, write to the contact below.
    body_ko: >-
      [종료] 모든 기존 참가자 분께서 본인의 RSVP 답변(포스터 정보 등)을 수정하실
      수 있도록 설문 비밀번호를 이메일로 공유해 드렸습니다. 비밀번호를 받지
      못하신 분은 아래 문의처를 통해 연락 주시기 바랍니다.

  - at: "2026-08-27 15:30"
    body: >-
      [Closed] Registrations, the next-generation AI project's researchers and
      the speakers together reached the capacity of the hall, so general
      registration goes to limited availability for the time being.
    body_ko: >-
      [종료] 참가 신청 인원 + 차세대AI과제 참여연구원 + 연사의 총합이 정원에
      도달하여, 당분간 일반참가자 신청을 일부 공개로 전환합니다.

  - at: "2026-08-24 18:00"
    body: >-
      [Open] Registration opens. It runs until September 1, or until the hall
      is full, whichever comes first.
    body_ko: >-
      [시작] 참가 신청을 시작합니다. 9월 1일까지 접수하며, 정원 충족 시 조기
      마감될 수 있습니다.
